apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: hotel
  labels:
    app: hotel
    component: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: hotel
      component: backend
  template:
    metadata:
      labels:
        app: hotel
        component: backend
    spec:
      containers:
        - name: backend
          image: hotel/backend:latest
          ports:
            - containerPort: 3000
          env:
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: hotel-config
                  key: PORT
            - name: MONGO_URI
              valueFrom:
                secretKeyRef:
                  name: hotel-secret
                  key: MONGO_URI
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 20
