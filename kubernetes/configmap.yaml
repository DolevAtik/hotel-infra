apiVersion: v1
kind: ConfigMap
metadata:
  name: hotel-config
  namespace: hotel
  labels:
    app: hotel
data:
  # Backend
  PORT: "3000"
  MONGO_HOST: "mongodb"
  MONGO_PORT: "27017"
  MONGO_DB: "hotel"
  MONGO_AUTH_SOURCE: "admin"

  # Frontend
  REACT_APP_API_URL: "http://backend:3000"

  # mongo-express
  ME_CONFIG_MONGODB_SERVER: "mongodb"
  ME_CONFIG_MONGODB_PORT: "27017"
