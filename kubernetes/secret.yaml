apiVersion: v1
kind: Secret
metadata:
  name: hotel-secret
  namespace: hotel
  labels:
    app: hotel
type: Opaque
# Values are base64-encoded.
# admin     -> echo -n 'admin' | base64      => YWRtaW4=
# admin123  -> echo -n 'admin123' | base64   => YWRtaW4xMjM=
data:
  MONGO_ROOT_USERNAME: YWRtaW4=
  MONGO_ROOT_PASSWORD: YWRtaW4xMjM=
  ME_USERNAME: YWRtaW4=
  ME_PASSWORD: YWRtaW4xMjM=
stringData:
  # MONGO_URI is built from the values above; kept here for the backend convenience.
  MONGO_URI: "mongodb://admin:admin123@mongodb:27017/hotel?authSource=admin"
