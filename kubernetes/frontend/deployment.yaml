apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: hotel
  labels:
    app: hotel
    component: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: hotel
      component: frontend
  template:
    metadata:
      labels:
        app: hotel
        component: frontend
    spec:
      containers:
        - name: frontend
          image: hotel/frontend:latest
          ports:
            - containerPort: 80
          env:
            - name: REACT_APP_API_URL
              valueFrom:
                configMapKeyRef:
                  name: hotel-config
                  key: REACT_APP_API_URL
          resources:
            requests:
              cpu: "100m"
              memory: "64Mi"
            limits:
              cpu: "300m"
              memory: "256Mi"
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 20
