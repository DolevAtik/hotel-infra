apiVersion: apps/v1
kind: Deployment
metadata:
  name: hotel-frontend
  namespace: hotel
  labels:
    app: hotel-frontend
spec:
  replicas: 5
  selector:
    matchLabels:
      app: hotel-frontend
  template:
    metadata:
      labels:
        app: hotel-frontend
    spec:
      containers:
        - name: hotel-frontend
          image: dolevatik/hotel-frontend:50c86aff46d9f62379740e73177a3eea5fa11ea4
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 80
          # Runtime API base is provided via the mounted config.js (see configmap.yaml).
          volumeMounts:
            - name: runtime-config
              mountPath: /usr/share/nginx/html/config.js
              subPath: config.js
              readOnly: true
          resources:
            requests:
              cpu: "10m"
              memory: "16Mi"
            limits:
              cpu: "100m"
              memory: "64Mi"
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 20
      volumes:
        - name: runtime-config
          configMap:
            name: hotel-frontend-config
