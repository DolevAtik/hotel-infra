version: "3.9"

services:
  frontend:
    image: hotel/frontend:latest
    container_name: hotel-frontend
    build:
      context:  ../hotel-frontend
    ports:
      - "8080:80"
    environment:
      - REACT_APP_API_URL=http://localhost:3000
    depends_on:
      - backend
    networks:
      - hotel-net
    restart: unless-stopped

  backend:
    image: hotel/backend:latest
    container_name: hotel-backend
    build:
      context: ../hotel-backend
    ports:
      - "3000:5000"
    environment:
      - PORT=3000
      - MONGO_URI=mongodb://${MONGO_ROOT_USERNAME}:${MONGO_ROOT_PASSWORD}@mongodb:27017/hotel?authSource=admin
    depends_on:
      - mongodb
    networks:
      - hotel-net
    restart: unless-stopped

  mongodb:
    image: mongo:7.0
    container_name: hotel-mongodb
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_ROOT_USERNAME}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_ROOT_PASSWORD}
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - hotel-net
    restart: unless-stopped

  mongo-express:
    image: mongo-express:1.0.2
    container_name: hotel-mongo-express
    environment:
      - ME_CONFIG_MONGODB_ADMINUSERNAME=${MONGO_ROOT_USERNAME}
      - ME_CONFIG_MONGODB_ADMINPASSWORD=${MONGO_ROOT_PASSWORD}
      - ME_CONFIG_MONGODB_URL=mongodb://${MONGO_ROOT_USERNAME}:${MONGO_ROOT_PASSWORD}@mongodb:27017/
      - ME_CONFIG_BASICAUTH_USERNAME=${ME_USERNAME}
      - ME_CONFIG_BASICAUTH_PASSWORD=${ME_PASSWORD}
    ports:
      - "8081:8081"
    depends_on:
      - mongodb
    networks:
      - hotel-net
    restart: unless-stopped

networks:
  hotel-net:
    driver: bridge

volumes:
  mongo-data:
