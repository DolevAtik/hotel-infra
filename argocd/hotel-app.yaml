apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hotel
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/DolevAtik/hotel-infra.git
    targetRevision: main
    path: k8s

  destination:
    server: https://kubernetes.default.svc
    namespace: hotel

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true
